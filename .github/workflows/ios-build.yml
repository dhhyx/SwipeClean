name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-simulator:
    name: Build and package simulator app
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate project
        run: xcodebuild -list -project SwipeClean.xcodeproj

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project SwipeClean.xcodeproj \
            -scheme SwipeClean \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/SwipeCleanDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package simulator app
        if: success()
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/SwipeCleanDerivedData/Build/Products/Debug-iphonesimulator/SwipeClean.app" \
            "$RUNNER_TEMP/SwipeClean-Simulator.app.zip"

      - name: Upload app artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-Simulator
          path: ${{ runner.temp }}/SwipeClean-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 14

  build-resignable-ipa:
    name: Build resignable device IPA
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build for iOS Device
        run: |
          set -o pipefail
          xcodebuild \
            -project SwipeClean.xcodeproj \
            -scheme SwipeClean \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/SwipeCleanDeviceDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build | tee "$RUNNER_TEMP/xcodebuild-device.log"

      - name: Apply ad-hoc signature
        if: success()
        run: |
          APP_PATH="$RUNNER_TEMP/SwipeCleanDeviceDerivedData/Build/Products/Release-iphoneos/SwipeClean.app"
          /usr/bin/codesign --force --deep --sign - "$APP_PATH"
          /usr/bin/codesign --verify --deep --strict "$APP_PATH"

      - name: Package resignable IPA
        if: success()
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -R \
            "$RUNNER_TEMP/SwipeCleanDeviceDerivedData/Build/Products/Release-iphoneos/SwipeClean.app" \
            "$RUNNER_TEMP/Payload/"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Payload" \
            "$RUNNER_TEMP/SwipeClean-resignable.ipa"

      - name: Upload resignable IPA
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SwipeClean-Resignable-IPA
          path: ${{ runner.temp }}/SwipeClean-resignable.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload device build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-device-log
          path: ${{ runner.temp }}/xcodebuild-device.log
          if-no-files-found: ignore
          retention-days: 14
